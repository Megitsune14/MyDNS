services:
  mydns:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: mydns

    restart: unless-stopped

    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000"
      # - "192.168.1.145:53:53/udp"
      # - "192.168.1.145:53:53/tcp"
      # - "192.168.1.145:3000:3000"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    dns_search: []

    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - mydns_data:/data

    environment:
      MONGODB_URI: mongodb://mongo:27017/mydns

      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      JWT_SECRET: change-this-secret

      DNS_PORT: 53
      DNS_BIND: 0.0.0.0

      HTTP_PORT: 3000

      DATA_DIR: /data
      NODE_ENV: production

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  mongo:
    image: mongo:4.4.18

    container_name: mydns-mongo

    restart: unless-stopped

    command: --wiredTigerCacheSizeGB 0.25

    dns:
      - 1.1.1.1
      - 8.8.8.8

    dns_search: []

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongo",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mydns_data:
  mongo_data: