# Linux / QNAP — conserve les vraies IP clients DNS (comme Pi-hole).
# Usage : docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
services:
  mydns:
    network_mode: host
    ports: !reset null
    environment:
      MONGODB_URI: mongodb://127.0.0.1:27017/mydns

  mongo:
    ports:
      - "127.0.0.1:27017:27017"
